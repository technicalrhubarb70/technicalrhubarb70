<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Kazi Ayesha — animated sunflower-yellow honeycomb banner</title>
  <desc id="description">A charcoal technology-themed banner with a golden honeycomb highlight sweeping continuously from right to left.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111112"/>
      <stop offset="0.58" stop-color="#171617"/>
      <stop offset="1" stop-color="#1d1a13"/>
    </linearGradient>

    <linearGradient id="titleShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101011" stop-opacity="0.97"/>
      <stop offset="0.7" stop-color="#101011" stop-opacity="0.83"/>
      <stop offset="1" stop-color="#101011" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.24" stop-color="#626262"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.76" stop-color="#626262"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <pattern id="hexBase" width="83.14" height="72" patternUnits="userSpaceOnUse">
      <path d="M20.785 0 41.57 12 41.57 36 20.785 48 0 36 0 12Z M62.355 36 83.14 48 83.14 72 62.355 84 41.57 72 41.57 48Z" fill="none" stroke="#343233" stroke-width="1.5"/>
    </pattern>

    <pattern id="hexGold" width="83.14" height="72" patternUnits="userSpaceOnUse">
      <path d="M20.785 0 41.57 12 41.57 36 20.785 48 0 36 0 12Z M62.355 36 83.14 48 83.14 72 62.355 84 41.57 72 41.57 48Z" fill="none" stroke="#ffd447" stroke-width="3"/>
    </pattern>

    <mask id="movingLight" maskUnits="userSpaceOnUse">
      <rect width="1200" height="340" fill="#000000"/>
      <rect x="1250" y="0" width="470" height="340" fill="url(#beam)">
        <animate attributeName="x" values="1250;-520" dur="6.5s" repeatCount="indefinite"/>
      </rect>
    </mask>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#background)"/>
  <rect width="1200" height="340" fill="url(#hexBase)"/>
  <rect width="1200" height="340" fill="url(#hexGold)" mask="url(#movingLight)" filter="url(#glow)"/>

  <rect width="880" height="340" fill="url(#titleShade)"/>
  <rect x="0" y="0" width="1200" height="5" fill="#f7c948"/>
  <rect x="0" y="335" width="1200" height="5" fill="#332b16"/>

  <path d="M0 271H315L367 340H0Z" fill="#f7c948"/>
  <path d="M0 263H321L378 340" fill="none" stroke="#f7c948" stroke-width="1.5" opacity="0.65"/>

  <text x="74" y="121" fill="#f5f2e9" font-family="Segoe UI, Arial, sans-serif" font-size="47" font-weight="700" letter-spacing="1.1">Kazi Ayesha</text>
  <text x="77" y="160" fill="#f7c948" font-family="Consolas, monospace" font-size="16" letter-spacing="3.4">COMPUTER SCIENCE · AIUB</text>
  <path d="M77 185H366" stroke="#f7c948" stroke-width="1" opacity="0.6"/>
  <text x="77" y="219" fill="#bbb7aa" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="1">building with purpose</text>

  <text x="75" y="311" fill="#171717" font-family="Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.5">TECHNICALRHUBARB70</text>
</svg>
